<!DOCTYPE html>
<html lang="en">

<head>
  {% load static %}
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Text to Image Converter</title>

  <!-- Bootstrap & FontAwesome -->
  <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
  <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.css' %}">
  <link rel="stylesheet" type="text/css" href="{% static 'css/font-awesome.min.css' %}">

  <!-- Internal CSS -->
  <style>
    /* Fullscreen background video */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    .navbar-nav {
      margin-left: auto;
    }

    .hero_area {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #FFF8DC;
    }
.navbar-brand span {
  font-size: 2rem; /* Increase font size for 'MARS' */
  font-weight: bold;
}

.navbar-nav .nav-link {
  font-size: 1.2rem; /* Increase font size for navigation links */
  font-weight: bold;
}

    .detail-box h1 {
      font-size: 4rem; /* Increased font size */
    }

    .detail-box p {
      color: #FFD700; /* Changed color to gold */
    }
  </style>
</head>

<body>
 
  <!-- Background Video -->
  <video autoplay muted loop id="bg-video">
    <source src="{% static 'images/35.mp4' %}" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Header Section -->
  <header class="header_section">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="{% url 'homepage' %}">
          <span>MARS</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active"><a class="nav-link" href="{% url 'homepage' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact Us</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <div class="hero_area">
    <div class="container">
      <div class="detail-box">
        <h1>Speech to Image Converter using AI</h1>
        <p>
          Text-to-image generation has seen remarkable progress with the advent of deep learning models...
        </p>
        <a href="{% static 'images/welcome.gif' %}" class="btn btn-primary">Welcome</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="{% static 'js/jquery-3.4.1.min.js' %}"></script>
  <script src="{% static 'js/bootstrap.js' %}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
  <script src="{% static 'js/custom.js' %}"></script>

</body>

</html>
